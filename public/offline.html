<style>

  p { margin:0 0 20px; opacity:.7; max-width:30ch; line-height:1.5; }

  <main>
    <img src="/illustrations/offline.png" width="456" height="318" alt="" />

    <button onclick="location.reload()">Try again</button>
    <p style="margin:20px auto 0;font-size:12px;opacity:.5">Illustration by <a href="https://icons8.com/illustrations" style="color:inherit">Icons8</a></p>
